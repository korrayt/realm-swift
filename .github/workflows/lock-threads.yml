name: "Lock Threads"

on:
  schedule:
  - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write

concurrency:
  group: lock-threads

jobs:
  action:
    runs-on: ubuntu-latest

    steps:
      - name: Lock inactive threads
        uses: dessant/lock-threads@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: "30"
          pr-inactive-days: "30"
          log-output: true
